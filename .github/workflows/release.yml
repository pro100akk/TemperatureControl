name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check metadata and release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/configure_repository.py --check --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build archive
        run: python tools/build_assets.py
      - name: Check generated translations are committed
        run: git diff --exit-code -- custom_components
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/apartment_comfort-*.zip --verify-tag --title "Apartment Comfort $RELEASE_TAG" --notes-file CHANGELOG.md --latest
