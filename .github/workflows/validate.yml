name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository metadata
        run: python tools/configure_repository.py --check --repository "$GITHUB_REPOSITORY"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: tests/frontend
        run: npm ci
      - name: Install test browser
        working-directory: tests/frontend
        run: npx playwright install --with-deps chromium
      - name: Validate translations and browser downloads
        working-directory: tests/frontend
        run: npm test
      - name: Compile Python
        run: python -m compileall -q custom_components tools tests
      - name: Build installation archive
        run: python tools/build_assets.py
      - name: Check generated translations are committed
        run: git diff --exit-code -- custom_components

  hacs:
    # HACS can only validate/install public repositories.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS custom repository validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
          comment: "false"
